<svg viewBox="0 0 680 470" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
<title>schedule-onepager-skill 架构图</title>
<desc>一个 skill、一个 SQLite、一个统一 CLI，HTML 只是导出视图</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="40" y="30" width="600" height="420" rx="20" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="58" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">schedule-onepager-skill · 公开仓库（Zaosusu/schedule-onepager-skill）</text>

<g>
  <rect x="60" y="78" width="260" height="150" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="190" y="100" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#085041">personal.db · 唯一数据源（my/ 不入库）</text>
  <rect x="78" y="114" width="224" height="30" rx="7" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="190" y="129" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#04342C">schedule 排期表（倒计时自动算）</text>
  <rect x="78" y="152" width="224" height="30" rx="7" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="190" y="167" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#04342C">todo 今日待办（当天动作）</text>
  <rect x="78" y="190" width="224" height="30" rx="7" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="190" y="205" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#04342C">history 每日历史（流水账）</text>
</g>

<g>
  <rect x="370" y="78" width="250" height="150" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text x="495" y="100" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#633806">scripts/personal.py · 统一 CLI</text>
  <text x="495" y="124" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#854F0B">add / list / export / done</text>
  <text x="495" y="144" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#854F0B">set / stats</text>
  <text x="495" y="176" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#854F0B">零第三方依赖</text>
  <text x="495" y="196" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#854F0B">countdown / lint / send 辅助</text>
</g>

<line x1="320" y1="140" x2="366" y2="140" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="343" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444441">读写</text>

<g>
  <rect x="60" y="258" width="560" height="120" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="280" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C">export → HTML 仅作导出视图（永不手工编辑）</text>
  <rect x="80" y="294" width="160" height="64" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="160" y="318" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#042C53">行程总表.html</text>
  <text x="160" y="338" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0C447C">schedule 视图</text>
  <rect x="260" y="294" width="160" height="64" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="318" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#042C53">今日TODO.html</text>
  <text x="340" y="338" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0C447C">todo 视图</text>
  <rect x="440" y="294" width="160" height="64" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="520" y="318" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#042C53">每日历史记录.html</text>
  <text x="520" y="338" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0C447C">history 视图</text>
</g>

<line x1="495" y1="228" x2="495" y2="254" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="495" y1="254" x2="160" y2="254" stroke="#5F5E5A" stroke-width="1"/>
<line x1="160" y1="254" x2="160" y2="290" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="254" x2="340" y2="290" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="520" y1="254" x2="520" y2="290" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="60" y="398" width="560" height="36" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
<text x="340" y="420" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#72243E">脱敏规则：my/ *.db config.json settings.local.json 永不入库；示例全部虚构</text>
</svg>
